name: rust-release-windows-unsigned

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing windows-v* or electivus-v* tag whose commit should be built.
        required: true
        type: string
      publish_release:
        description: Attach the unsigned Windows assets to a GitHub prerelease.
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing windows-v* or electivus-v* tag whose commit should be built.
        required: true
        type: string
      publish_release:
        description: Attach the unsigned Windows assets to a GitHub prerelease.
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  # Keep this distinct from callers such as electivus-release to avoid a
  # reusable-workflow concurrency collision.
  group: rust-release-windows-unsigned-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  WINDOWS_BINARIES: "codex codex-code-mode-host codex-responses-api-proxy codex-windows-sandbox-setup codex-command-runner codex-app-server"

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Validate tag and Cargo version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^(windows|electivus)-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha(\.[0-9]+){0,2}|beta(\.[0-9]+)?))?$ ]]; then
            echo "Release tag '$RELEASE_TAG' does not match a supported windows-v* or electivus-v* format" >&2
            exit 1
          fi

          version="${RELEASE_TAG#*-v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' codex-rs/Cargo.toml | head -n1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Release tag version $version does not match Cargo version $cargo_version" >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n1 "$RELEASE_TAG")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checkout_commit" ]]; then
            echo "Checked out $checkout_commit instead of tag commit $tag_commit" >&2
            exit 1
          fi

          echo "release_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows-binaries:
    name: Build Windows binaries - ${{ matrix.runner }} - ${{ matrix.target }} - ${{ matrix.bundle }}
    needs: validate-release-tag
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-x64
            runs_on: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: primary
            binaries: "codex codex-code-mode-host codex-responses-api-proxy"
          - runner: windows-arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: primary
            binaries: "codex codex-code-mode-host codex-responses-api-proxy"
          - runner: windows-x64
            runs_on: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: helpers
            binaries: "codex-windows-sandbox-setup codex-command-runner"
          - runner: windows-arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: helpers
            binaries: "codex-windows-sandbox-setup codex-command-runner"
          - runner: windows-x64
            runs_on: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: app-server
            binaries: "codex-app-server codex-code-mode-host"
          - runner: windows-arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: app-server
            binaries: "codex-app-server codex-code-mode-host"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.release_commit }}

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Configure LLVM linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Cargo build
        shell: bash
        run: |
          target="${{ matrix.target }}"
          if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi

          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target "$target" --release --timings "${build_args[@]}"

      - name: Stage Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$CARGO_TARGET_DIR/${{ matrix.target }}/release"
          output_dir="$release_dir/staged-${{ matrix.bundle }}"
          mkdir -p "$output_dir"

          for binary in ${{ matrix.binaries }}; do
            pdb_name="${binary//-/_}"
            pdb_path="$release_dir/${pdb_name}.pdb"
            if [[ ! -f "$pdb_path" ]]; then
              pdb_path="$release_dir/${binary}.pdb"
            fi
            if [[ ! -f "$pdb_path" ]]; then
              echo "PDB for $binary was not generated" >&2
              exit 1
            fi

            cp "$release_dir/${binary}.exe" "$output_dir/${binary}.exe"
            cp "$pdb_path" "$output_dir/${binary}.pdb"
          done

      - name: Upload intermediate Windows binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-binaries-${{ matrix.target }}-${{ matrix.bundle }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/staged-${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Package unsigned Windows assets - ${{ matrix.target }}
    needs:
      - validate-release-tag
      - build-windows-binaries
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release-tag.outputs.release_commit }}

      - uses: ./.github/actions/setup-ci

      - name: Download prebuilt Windows binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-binaries-${{ matrix.target }}-*
          merge-multiple: true
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          for binary in ${WINDOWS_BINARIES}; do
            test -f "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${binary}.exe"
          done

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${{ matrix.target }}"
          mkdir -p "$dest"

          for binary in ${WINDOWS_BINARIES}; do
            cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${binary}.exe" \
              "$dest/${binary}-${{ matrix.target }}.exe"
          done

      - name: Build Codex package archives
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          archive_script="${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh"
          temp_root="${RUNNER_TEMP}/codex-package-archives"

          mkdir -p "$temp_root/primary" "$temp_root/app-server"
          printf '%s\0' primary app-server |
            xargs -0 -P0 -I{} env \
              TMPDIR="$temp_root/{}" \
              TMP="$temp_root/{}" \
              TEMP="$temp_root/{}" \
              bash "$archive_script" \
                --target "$target" \
                --bundle "{}" \
                --entrypoint-dir "$CARGO_TARGET_DIR/$target/release" \
                --archive-dir "dist/$target"

      - name: Build Python runtime wheel
        shell: bash
        env:
          CODEX_VERSION: ${{ needs.validate-release-tag.outputs.version }}
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            aarch64-pc-windows-msvc)
              platform_tag="win_arm64"
              ;;
            x86_64-pc-windows-msvc)
              platform_tag="win_amd64"
              ;;
            *)
              echo "No Python runtime wheel platform tag for ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          python -m venv "${RUNNER_TEMP}/python-runtime-build-venv"
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" -m pip install build

          stage_dir="${RUNNER_TEMP}/openai-codex-cli-bin-${{ matrix.target }}"
          wheel_dir="${GITHUB_WORKSPACE}/python-runtime-dist/${{ matrix.target }}"
          python "${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py" \
            stage-runtime \
            "$stage_dir" \
            "dist/${{ matrix.target }}/codex-package-${{ matrix.target }}.tar.gz" \
            --codex-version "$CODEX_VERSION" \
            --platform-tag "$platform_tag"
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" \
            -m build --wheel --outdir "$wheel_dir" "$stage_dir"

      - name: Compress standalone binaries
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/${{ matrix.target }}"
          repo_root="$PWD"
          target="${{ matrix.target }}"
          export dest repo_root target

          # shellcheck disable=SC2016
          printf '%s\0' "$dest"/*.exe |
            xargs -0 -n1 -P2 bash -c '
            set -euo pipefail
            f=$1
            base="$(basename "$f")"
            tar -C "$dest" -czf "$dest/${base}.tar.gz" "$base"

            if [[ "$base" == "codex-${target}.exe" ]]; then
              bundle_dir="$(mktemp -d)"
              trap '\''rm -rf "$bundle_dir"'\'' EXIT
              cp "$dest/$base" "$bundle_dir/$base"
              cp "$dest/codex-command-runner-${target}.exe" \
                "$bundle_dir/codex-command-runner.exe"
              cp "$dest/codex-windows-sandbox-setup-${target}.exe" \
                "$bundle_dir/codex-windows-sandbox-setup.exe"
              (cd "$bundle_dir" && 7z a "$repo_root/$dest/${base}.zip" .)
            else
              (cd "$dest" && 7z a "${base}.zip" "$base")
            fi

            "${GITHUB_WORKSPACE}/.github/workflows/zstd" -T0 -19 "$dest/$base"
          ' _

      - name: Upload unsigned Windows assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-unsigned
          path: codex-rs/dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Python runtime wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-runtime-wheel-${{ matrix.target }}-unsigned
          path: python-runtime-dist/${{ matrix.target }}/*.whl
          if-no-files-found: error
          retention-days: 30

  publish-github-prerelease:
    name: Publish unsigned Windows prerelease
    if: ${{ inputs.publish_release }}
    needs:
      - validate-release-tag
      - package-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download unsigned Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-pc-windows-msvc-unsigned"
          merge-multiple: true
          path: dist

      - name: Download Python runtime wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-runtime-wheel-*-unsigned
          merge-multiple: true
          path: dist

      - name: Add Codex package checksum manifest
        shell: bash
        run: |
          set -euo pipefail

          manifest="dist/codex-package_SHA256SUMS"
          tmp_manifest="$(mktemp)"
          find dist -type f \
            \( -name 'codex-package-*.tar.gz' -o -name 'codex-app-server-package-*.tar.gz' \) \
            -print |
            sort |
            while IFS= read -r archive; do
              sha256sum "$archive" |
                awk -v name="$(basename "$archive")" '{ print $1 "  " name }'
            done > "$tmp_manifest"

          if [[ ! -s "$tmp_manifest" ]]; then
            echo "No Codex package archives found for checksum manifest"
            exit 1
          fi

          mv "$tmp_manifest" "$manifest"
          cat "$manifest"

      - name: Write release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cat > release-notes.md <<EOF
          Windows-only prerelease for ${RELEASE_TAG}.

          These artifacts were built by GitHub-hosted runners and are not code signed.
          Windows may display an unverified-publisher warning.
          EOF

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          body_path: release-notes.md
          files: dist/**
          make_latest: false
          name: ${{ needs.validate-release-tag.outputs.version }} Windows unsigned
          prerelease: true
          tag_name: ${{ inputs.release_tag }}
