name: rust-ci-full
on:
  workflow_call:
    inputs:
      validation_scope:
        description: Validation scope (merge-gate, extended, windows, or full).
        required: false
        default: full
        type: string
    outputs:
      resolved_scope:
        description: Planner-resolved validation scope.
        value: ${{ jobs.results.outputs.resolved_scope }}
      selected_families:
        description: JSON list of validation families selected by the planner.
        value: ${{ jobs.results.outputs.selected_families }}
  push:
    branches:
      # Main pushes enter through postmerge-ci. Keep this opt-in branch trigger
      # for developers who want the full suite before merging.
      - "**full-ci**"
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Validation scope.
        required: true
        default: full
        type: choice
        options:
          - merge-gate
          - extended
          - windows
          - full

jobs:
  plan:
    name: Plan Rust CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      resolved_scope: ${{ steps.scope.outputs.resolved_scope }}
      reason: ${{ steps.scope.outputs.reason }}
      lint_matrix: ${{ steps.scope.outputs.lint_matrix }}
      run_general: ${{ steps.scope.outputs.run_general }}
      run_linux_x64: ${{ steps.scope.outputs.run_linux_x64 }}
      run_linux_arm64: ${{ steps.scope.outputs.run_linux_arm64 }}
      run_windows_x64: ${{ steps.scope.outputs.run_windows_x64 }}
      run_windows_arm64: ${{ steps.scope.outputs.run_windows_arm64 }}
      selected_families: ${{ steps.scope.outputs.selected_families }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve validation scope
        id: scope
        env:
          VALIDATION_SCOPE: ${{ inputs.validation_scope }}
        run: python3 .github/scripts/rust_ci_full_plan.py

  # --- CI that doesn't need specific targets ---------------------------------
  general:
    name: Format / etc
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_general == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Rust benchmark smoke test
        run: just bench-smoke

  cargo_shear:
    name: cargo shear
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_general == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-shear@1.11.2
      - name: cargo shear
        run: cargo shear --deny-warnings

  argument_comment_lint_package:
    name: Argument comment lint package
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_general == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_DYLINT_VERSION: 5.0.0
      DYLINT_LINK_VERSION: 5.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: nightly-2025-09-18
          components: llvm-tools-preview, rustc-dev, rust-src
      - name: Cache cargo-dylint tooling
        id: cargo_dylint_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: argument-comment-lint-${{ runner.os }}-${{ env.CARGO_DYLINT_VERSION }}-${{ env.DYLINT_LINK_VERSION }}-${{ hashFiles('tools/argument-comment-lint/Cargo.lock', 'tools/argument-comment-lint/rust-toolchain', '.github/workflows/rust-ci.yml', '.github/workflows/rust-ci-full.yml') }}
      - name: Install cargo-dylint tooling
        if: ${{ steps.cargo_dylint_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          cargo install --locked cargo-dylint --version "$CARGO_DYLINT_VERSION"
          cargo install --locked dylint-link --version "$DYLINT_LINK_VERSION"
      - name: Check Python wrapper syntax
        run: python3 -m py_compile tools/argument-comment-lint/wrapper_common.py tools/argument-comment-lint/run.py tools/argument-comment-lint/run-prebuilt-linter.py tools/argument-comment-lint/test_wrapper_common.py
      - name: Test Python wrapper helpers
        run: python3 -m unittest discover -s tools/argument-comment-lint -p 'test_*.py'
      - name: Test argument comment lint package
        working-directory: tools/argument-comment-lint
        run: cargo test
        env:
          RUST_MIN_STACK: "8388608" # 8 MiB

  argument_comment_lint_prebuilt:
    name: Argument comment lint - ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_general == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-argument-comment-lint
        with:
          target: ${{ runner.os }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

  argument_comment_lint_windows:
    name: Argument comment lint - Windows x64
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_windows_x64 == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 60
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-argument-comment-lint
        with:
          target: ${{ runner.os }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

  # --- CI to validate on different os/targets --------------------------------
  lint_build:
    name: Lint/Build — ${{ matrix.runner }} - ${{ matrix.target }}${{ matrix.profile == 'release' && ' (release)' || '' }}
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Standard Windows runners use their local Cargo cache; sccache is retained on Linux.
      USE_SCCACHE: ${{ startsWith(matrix.runner, 'windows') && 'false' || 'true' }}
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 10G

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lint_matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev
          fi
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Configure Windows ARM64 MSVC environment
        if: ${{ runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc' }}
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Compute lockfile hash
        id: lockhash
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Explicit cache restore: split cargo home vs target, so we can
      # avoid caching the large target dir on the gnu-dev job.
      - name: Restore cargo home cache
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      # Install and restore sccache cache
      - name: Install sccache
        if: ${{ env.USE_SCCACHE == 'true' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ env.USE_SCCACHE == 'true' }}
        shell: bash
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-
            sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Prepare APT cache directories (musl)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/cache/apt/archives /var/lib/apt/lists
          sudo chown -R "$USER:$USER" /var/cache/apt /var/lib/apt/lists

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Restore APT cache (musl)
        id: cache_apt_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0

      - if: ${{ matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'}}
        name: Install musl build tools
        env:
          DEBIAN_FRONTEND: noninteractive
          TARGET: ${{ matrix.target }}
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Install cargo-chef
        if: ${{ matrix.profile == 'release' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-chef
          version: 0.1.71

      - name: Pre-warm dependency cache (cargo-chef)
        if: ${{ matrix.profile == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          RECIPE="${RUNNER_TEMP}/chef-recipe.json"
          cargo chef prepare --recipe-path "$RECIPE"
          cargo chef cook --recipe-path "$RECIPE" --target ${{ matrix.target }} --release

      - name: cargo build (release)
        if: ${{ matrix.profile == 'release' }}
        run: cargo build --workspace --target ${{ matrix.target }} --profile release --timings

      - name: Upload Cargo timings (build)
        if: always() && matrix.profile == 'release'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-ci-build-${{ matrix.target }}-release
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: cargo clippy (dev)
        if: ${{ matrix.profile == 'dev' }}
        run: cargo clippy --workspace --target ${{ matrix.target }} --tests --profile dev --timings -- -D warnings

      - name: cargo clippy (release)
        if: ${{ matrix.profile == 'release' }}
        run: cargo clippy --workspace --target ${{ matrix.target }} --tests --profile release --timings -- -D warnings

      - name: Upload Cargo timings (clippy)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-ci-clippy-${{ matrix.target }}-${{ matrix.profile }}
          path: ${{ env.CARGO_TARGET_DIR }}/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      # Save caches explicitly; make non-fatal so cache packaging
      # never fails the overall job. Only save when key wasn't hit.
      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.USE_SCCACHE == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.profile }}-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.USE_SCCACHE == 'true'
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.USE_SCCACHE == 'true'
        shell: bash
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }} (${{ matrix.profile }})";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save APT cache (musl)
        if: always() && !cancelled() && (matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl') && steps.cache_apt_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            /var/cache/apt
          key: apt-${{ matrix.runner }}-${{ matrix.target }}-v1

  tests_linux_x64:
    name: Tests — ubuntu-24.04 - x86_64-unknown-linux-gnu
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_linux_x64 == 'true' }}
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-x64
      # The per-test /tmp cleanup runner requires serial execution within each shard.
      test_threads: 1
      use_sccache: true
      postgres_contracts: true
    secrets: inherit

  tests_linux_arm64:
    name: Tests — ubuntu-24.04-arm - aarch64-unknown-linux-gnu
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_linux_arm64 == 'true' }}
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      profile: ci-test
      artifact_id: linux-arm64
      # The per-test /tmp cleanup runner requires serial execution within each shard.
      test_threads: 1
      use_sccache: true

  tests_windows_x64:
    name: Tests — Windows x64 - x86_64-pc-windows-msvc
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_windows_x64 == 'true' }}
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      profile: ci-test
      artifact_id: windows-x64

  tests_windows_arm64:
    name: Tests — Windows ARM64 - aarch64-pc-windows-msvc
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.run_windows_arm64 == 'true' }}
    uses: ./.github/workflows/rust-ci-full-nextest-platform.yml
    with:
      runner: windows-11-arm
      archive_runner: windows-2025
      target: aarch64-pc-windows-msvc
      profile: ci-test
      artifact_id: windows-arm64
    secrets: inherit

  # --- Gatherer job for the full post-merge workflow --------------------------
  results:
    name: Full CI results
    outputs:
      resolved_scope: ${{ needs.plan.outputs.resolved_scope }}
      selected_families: ${{ needs.plan.outputs.selected_families }}
    needs:
      [
        plan,
        general,
        cargo_shear,
        argument_comment_lint_package,
        argument_comment_lint_prebuilt,
        argument_comment_lint_windows,
        lint_build,
        tests_linux_x64,
        tests_linux_arm64,
        tests_windows_x64,
        tests_windows_arm64,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate scoped child results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESOLVED_SCOPE: ${{ needs.plan.outputs.resolved_scope }}
          GENERAL_RESULT: ${{ needs.general.result }}
          CARGO_SHEAR_RESULT: ${{ needs.cargo_shear.result }}
          ARGUMENT_COMMENT_LINT_PACKAGE_RESULT: ${{ needs.argument_comment_lint_package.result }}
          ARGUMENT_COMMENT_LINT_PREBUILT_RESULT: ${{ needs.argument_comment_lint_prebuilt.result }}
          ARGUMENT_COMMENT_LINT_WINDOWS_RESULT: ${{ needs.argument_comment_lint_windows.result }}
          LINT_BUILD_RESULT: ${{ needs.lint_build.result }}
          TESTS_LINUX_X64_RESULT: ${{ needs.tests_linux_x64.result }}
          TESTS_LINUX_ARM64_RESULT: ${{ needs.tests_linux_arm64.result }}
          TESTS_WINDOWS_X64_RESULT: ${{ needs.tests_windows_x64.result }}
          TESTS_WINDOWS_ARM64_RESULT: ${{ needs.tests_windows_arm64.result }}
        run: python3 .github/scripts/rust_ci_full_result.py

      - name: sccache summary note
        if: always()
        run: |
          echo "Per-job sccache stats are attached to each matrix job's Step Summary."
