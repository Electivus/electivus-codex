name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
# Manual dispatch supports a second non-retry run during Stability certification.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  postgres-runtime-state-contracts:
    name: PostgreSQL Runtime State contracts
    uses: ./.github/workflows/postgres-runtime-state-contracts.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  deep-linux-eligibility:
    name: Deep Linux eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify Deep Linux eligibility
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          eligible=true
          reason="classifier did not run; Deep Linux remains eligible"
          classifier_status=0
          classifier_output="$(python3 .github/scripts/deep_linux_changes.py \
            --event-name "${EVENT_NAME}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" 2>&1)" || classifier_status=$?

          if [[ $classifier_status -ne 0 ]]; then
            reason="classifier exited with status ${classifier_status}; Deep Linux remains eligible"
          else
            mapfile -t classifier_lines <<< "$classifier_output"
            if [[ ${#classifier_lines[@]} -eq 2 \
              && ${classifier_lines[0]} =~ ^eligible=(true|false)$ \
              && ${classifier_lines[1]} == reason=?* ]]; then
              eligible="${BASH_REMATCH[1]}"
              reason="${classifier_lines[1]#reason=}"
            else
              reason="classifier returned malformed output; Deep Linux remains eligible"
            fi
          fi

          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deep Linux eligibility"
            echo
            echo "- Eligible: \`${eligible}\`"
            echo "- Reason: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - deep-linux-eligibility
      - postgres-runtime-state-contracts
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same revision as the caller and child workflows.
      # CI workflow uploads are restricted, so this repository does not need a
      # separate trusted-base checkout for the terminal policy step. Using the
      # PR head also lets the introducing PR exercise a newly added helper.
      #
      # During the initial rollout, PR branches created before
      # check_ci_results.py exists must rebase onto main before this gate can
      # run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
