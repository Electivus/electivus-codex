name: Validation Integrated

# Main is certified from the exact commit that triggered this workflow. The
# serialized concurrency group is the Certification lock: no integrated run
# may be cancelled or overtaken by another integrated candidate.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: validation-integrated-main
  cancel-in-progress: false

jobs:
  preflight:
    name: Integrated Validation Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      selected_evidence: ${{ steps.plan.outputs.selected_evidence }}
      codeql_languages: ${{ steps.plan.outputs.codeql_languages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Emit the exact Integrated plan
        id: plan
        shell: bash
        run: |
          set +e
          mapfile -t changed_files < <(git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}")
          command=(
            python3 .github/scripts/validation_entrypoint.py
            --root "$GITHUB_WORKSPACE"
            --output-dir "$RUNNER_TEMP/validation-output"
            --event-name "$GITHUB_EVENT_NAME"
            --repository "$GITHUB_REPOSITORY"
            --default-branch main
            --candidate "$GITHUB_SHA"
            --branch main
            --kind integrated
            --now "$(date +%s)"
            --preflight-only
          )
          for path in "${changed_files[@]}"; do command+=(--changed-file "$path"); done
          "${command[@]}"
          status=$?
          mkdir -p validation-output
          cp -R "$RUNNER_TEMP/validation-output/." validation-output/
          if [[ -f validation-output/validation-plan.json ]]; then
            selected="$(python3 -c 'import json,sys; print(json.dumps([x["family"] for x in json.load(open(sys.argv[1]))["evidence"] if x["selected"]], separators=(",", ":")))' validation-output/validation-plan.json)"
            languages="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["codeqlLanguages"], separators=(",", ":")))' validation-output/validation-plan.json)"
            echo "selected_evidence=$selected" >> "$GITHUB_OUTPUT"
            echo "codeql_languages=$languages" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Upload Integrated plan and Preflight evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validation-integrated-preflight-${{ github.run_id }}
          path: validation-output
          retention-days: 1
          if-no-files-found: warn

  bazel-full:
    name: Integrated Linux x64 Bazel
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'linux-x64-bazel') }}
    permissions:
      contents: read
    uses: ./.github/workflows/bazel.yml
    with:
      validation_scope: full
      validation_candidate: ${{ github.sha }}
    secrets: inherit

  rust-full:
    name: Integrated Rust deep coverage
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && (contains(needs.preflight.outputs.selected_evidence, 'linux-x64-cargo') || contains(needs.preflight.outputs.selected_evidence, 'linux-arm64') || contains(needs.preflight.outputs.selected_evidence, 'linux-musl') || contains(needs.preflight.outputs.selected_evidence, 'rust-fast') || contains(needs.preflight.outputs.selected_evidence, 'code-quality')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/rust-ci-full.yml
    with:
      validation_scope: full
      validation_candidate: ${{ github.sha }}
    secrets: inherit

  postgresql:
    name: Integrated PostgreSQL Runtime State
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'postgresql') }}
    permissions:
      contents: read
    uses: ./.github/workflows/postgres-runtime-state-contracts.yml
    with:
      validation_candidate: ${{ github.sha }}
    secrets: inherit

  v8:
    name: Integrated V8 and sandbox
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'v8') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/v8-canary.yml
    with:
      validation_candidate: ${{ github.sha }}
    secrets: inherit

  windows:
    name: Integrated Windows - ${{ matrix.name }}
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'windows-x64') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: ARM64
            runner:
              group: ${{ github.event.repository.name }}-runners
              labels: ${{ github.event.repository.name }}-windows-arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Run complete Windows validation
        shell: bash
        working-directory: codex-rs
        run: just test

  codeql:
    name: Integrated advanced CodeQL - ${{ matrix.language }}
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'codeql-advanced') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL without security authority
        if: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        uses: github/codeql-action/init@6f530319d8c989665d0835536ec9571735fd2008 # pinned Shadow implementation
        with:
          languages: ${{ matrix.language }}
      - name: Build CodeQL database
        if: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        uses: github/codeql-action/autobuild@6f530319d8c989665d0835536ec9571735fd2008 # pinned Shadow implementation
      - name: Analyze without publishing security state
        if: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        uses: github/codeql-action/analyze@6f530319d8c989665d0835536ec9571735fd2008 # pinned Shadow implementation
        with:
          upload: never

  targeted:
    name: Integrated targeted contracts
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      validation_outcome: ${{ steps.validation_outcome.outputs.validation_outcome }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Run targeted contract families
        id: product
        continue-on-error: true
        env:
          SELECTED: ${{ needs.preflight.outputs.selected_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SELECTED" == *api-protocol-sdk* ]]; then
            (cd codex-rs && just test -p codex-app-server-protocol)
          fi
          if [[ "$SELECTED" == *release-packaging* ]]; then
            python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'
          fi
          if [[ "$SELECTED" == *synchronization-topology* ]]; then
            python3 -m unittest .github/scripts/test_upstream_sync_manifest.py
            python3 -m unittest .github/scripts/test_sync_upstream_release.py
          fi
      - name: Attribute targeted validation outcome
        id: validation_outcome
        if: always()
        env:
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          outcome=infrastructure-failure
          case "$PRODUCT_OUTCOME" in
            success) outcome=passed ;;
            failure) outcome=product-failure ;;
            cancelled) outcome=stale ;;
            skipped) outcome=indeterminate ;;
          esac
          echo "validation_outcome=$outcome" >> "$GITHUB_OUTPUT"
      - name: Fail after recording targeted product outcome
        if: ${{ steps.product.outcome == 'failure' }}
        run: exit 1

  sdk:
    name: Integrated SDK contracts
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'api-protocol-sdk') }}
    permissions:
      contents: read
    uses: ./.github/workflows/sdk.yml
    with:
      validation_candidate: ${{ github.sha }}
    secrets: inherit

  aggregate:
    name: Integrated Validation certification
    needs:
      - preflight
      - bazel-full
      - rust-full
      - postgresql
      - v8
      - windows
      - codeql
      - targeted
      - sdk
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the exact Integrated implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download the complete Integrated preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-integrated-preflight-${{ github.run_id }}
          path: validation-output
      - name: Capture dependency conclusions
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$NEEDS" <<'PY'
          import sys
          from pathlib import Path

          Path("validation-output/needs.json").write_text(sys.argv[1] + "\n", encoding="utf-8")
          PY
      - name: Emit complete report and Integrated authority manifest
        shell: bash
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          now="$(date +%s)"
          started="$(cat validation-output/validation-started-at 2>/dev/null || echo 0)"
          elapsed=0
          if [[ "$started" =~ ^[0-9]+$ && "$now" =~ ^[0-9]+$ && "$now" -ge "$started" ]]; then
            elapsed=$((now - started))
          fi
          python3 .github/scripts/validation_emit_results.py \
            --plan validation-output/validation-plan.json \
            --results validation-output/needs.json \
            --output validation-output \
            --now "$now" \
            --duration-seconds "$elapsed" \
            --attempt "$ATTEMPT" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          report_status=${PIPESTATUS[0]}
          python3 .github/scripts/validation_integrated.py \
            --report validation-output/validation-report.json \
            --output validation-output/evidence/integrated.json
          integrated_status=$?
          exit $((report_status || integrated_status))
      - name: Derive authoritative state for exact main
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/validation_state_cli.py \
            --manifest validation-output/evidence/integrated.json \
            --current-main-sha "$GITHUB_SHA" \
            --output validation-output/validation-state.json \
            --allow-missing \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload Integrated certification and state
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validation-integrated-certification-${{ github.run_id }}
          path: validation-output
          retention-days: 90
          if-no-files-found: warn
