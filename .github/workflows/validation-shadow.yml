name: Validation Shadow

# The replacement graph is non-authoritative until Stability certification and
# the separately authorized cutover have completed.
on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      cache_fallback:
        description: Explicit cache-disabled reconstruction mode for Stability evidence
        required: false
        default: not-applicable
        type: choice
        options:
          - not-applicable
          - disabled-reconstruction

permissions: {}

concurrency:
  # Latest-wins applies to the complete Pull request graph. Every manifest
  # still carries candidate identity, so a late old result is stale.
  group: validation-shadow-${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Validation Preflight (Shadow)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan_path: ${{ steps.plan.outputs.plan_path }}
      profile: ${{ steps.plan.outputs.profile }}
      selected_evidence: ${{ steps.plan.outputs.selected_evidence }}
      codeql_languages: ${{ steps.plan.outputs.codeql_languages }}
    steps:
      - name: Checkout the synthetic Pull request candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Emit the versioned Validation plan
        id: plan
        env:
          BASE_SHA_INPUT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD_SHA_INPUT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set +e
          base_sha="$BASE_SHA_INPUT"
          head_sha="$HEAD_SHA_INPUT"
          base_ref="$GITHUB_BASE_REF"
          branch="$GITHUB_HEAD_REF"
          if [[ -z "$base_ref" ]]; then base_ref=main; fi
          if [[ -z "$branch" ]]; then branch="$GITHUB_REF_NAME"; fi
          if [[ -z "$base_sha" ]]; then
            base_sha="$(git rev-parse "origin/$base_ref")"
          fi
          if [[ -z "$head_sha" ]]; then
            head_sha="$GITHUB_SHA"
          fi
          command=(
            python3 .github/scripts/validation_entrypoint.py
            --root "$GITHUB_WORKSPACE"
            --output-dir "$RUNNER_TEMP/validation-output"
            --event-name "$GITHUB_EVENT_NAME"
            --repository "$GITHUB_REPOSITORY"
            --default-branch "$base_ref"
            --candidate "$GITHUB_SHA"
            --base "$base_sha"
            --head "$head_sha"
            --branch "$branch"
            --kind pull-request
            --now "$(date +%s)"
            --preflight-only
          )
          if [[ -n "$PR_NUMBER" ]]; then
            command+=(--pull-request "$PR_NUMBER")
          fi
          "${command[@]}"
          status=$?
          cp -R "$RUNNER_TEMP/validation-output" "$GITHUB_WORKSPACE/validation-output"
          exit "$status"
      - name: Upload Shadow plan and Preflight evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validation-shadow-preflight-${{ github.run_id }}
          path: validation-output
          retention-days: 1
          if-no-files-found: warn

  linux-x64-bazel:
    name: Validation Linux x64 Bazel
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'linux-x64-bazel') }}
    permissions:
      contents: read
    uses: ./.github/workflows/bazel.yml
    with:
      validation_scope: essential
      validation_candidate: ${{ github.sha }}

  postgresql:
    name: Validation PostgreSQL contracts
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'postgresql') }}
    permissions:
      contents: read
    uses: ./.github/workflows/postgres-runtime-state-contracts.yml
    with:
      validation_candidate: ${{ github.sha }}

  v8:
    name: Validation V8 evidence
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'v8') }}
    permissions:
      contents: read
    uses: ./.github/workflows/v8-canary.yml
    with:
      validation_candidate: ${{ github.sha }}

  windows-x64:
    name: Validation Windows x64
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'windows-x64') }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Run Windows x64 validation
        shell: bash
        working-directory: codex-rs
        run: just test

  targeted:
    name: Validation targeted families
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      validation_outcome: ${{ steps.validation_outcome.outputs.validation_outcome }}
    permissions:
      contents: read
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        if: ${{ contains(needs.preflight.outputs.selected_evidence, 'rust-fast') || contains(needs.preflight.outputs.selected_evidence, 'api-protocol-sdk') || contains(needs.preflight.outputs.selected_evidence, 'code-quality') }}
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Run selected targeted validation
        id: product
        continue-on-error: true
        shell: bash
        env:
          SELECTED: ${{ needs.preflight.outputs.selected_evidence }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED" == *rust-fast* || "$SELECTED" == *code-quality* ]]; then
            (cd codex-rs && just fmt-check)
          fi
          if [[ "$SELECTED" == *api-protocol-sdk* ]]; then
            (cd codex-rs && just test -p codex-app-server-protocol)
          fi
          if [[ "$SELECTED" == *release-packaging* ]]; then
            python3 -m unittest discover -s scripts/codex_package -p 'test_*.py'
          fi
          if [[ "$SELECTED" == *synchronization-topology* ]]; then
            python3 -m unittest .github/scripts/test_upstream_sync_manifest.py
            python3 -m unittest .github/scripts/test_sync_upstream_release.py
          fi
      - name: Attribute targeted validation outcome
        id: validation_outcome
        if: always()
        env:
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          outcome=infrastructure-failure
          case "$PRODUCT_OUTCOME" in
            success) outcome=passed ;;
            failure) outcome=product-failure ;;
            cancelled) outcome=stale ;;
            skipped) outcome=indeterminate ;;
          esac
          echo "validation_outcome=$outcome" >> "$GITHUB_OUTPUT"
      - name: Fail after recording targeted product outcome
        if: ${{ steps.product.outcome == 'failure' }}
        run: exit 1

  sdk:
    name: Validation SDK contracts
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'api-protocol-sdk') }}
    permissions:
      contents: read
    uses: ./.github/workflows/sdk.yml
    with:
      validation_candidate: ${{ github.sha }}
    secrets: inherit

  rust-full:
    name: Validation Certification-required Rust depth
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.profile == 'certification-required' }}
    permissions:
      contents: read
    uses: ./.github/workflows/rust-ci-full.yml
    with:
      validation_scope: full
      validation_candidate: ${{ github.sha }}
    secrets: inherit

  codeql-shadow:
    name: Validation Shadow CodeQL - ${{ matrix.language }}
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && contains(needs.preflight.outputs.selected_evidence, 'codeql-advanced') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - python
          - javascript-typescript
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Skip unchanged language
        if: ${{ !contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        run: echo "${{ matrix.language }} is not selected by the Validation plan."
      - name: Start selected language analysis
        id: codeql_start
        if: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Initialize Shadow CodeQL
        if: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        uses: github/codeql-action/init@6f530319d8c989665d0835536ec9571735fd2008 # pinned Shadow implementation
        with:
          languages: ${{ matrix.language }}
      - name: Build CodeQL database
        if: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        uses: github/codeql-action/autobuild@6f530319d8c989665d0835536ec9571735fd2008 # pinned Shadow implementation
      - name: Analyze without publishing security state
        id: analyze
        if: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
        uses: github/codeql-action/analyze@6f530319d8c989665d0835536ec9571735fd2008 # pinned Shadow implementation
        with:
          upload: never

      - name: Record language result
        if: always()
        env:
          LANGUAGE: ${{ matrix.language }}
          SELECTED: ${{ contains(needs.preflight.outputs.codeql_languages, matrix.language) }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          STARTED: ${{ steps.codeql_start.outputs.started || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codeql-result"
          outcome=not-required
          if [[ "$SELECTED" == "true" ]]; then
            case "$ANALYZE_OUTCOME" in
              success) outcome=passed ;;
              failure) outcome=indeterminate ;;
              *) outcome=stale ;;
            esac
          fi
          duration=0
          if [[ "$STARTED" =~ ^[0-9]+$ ]]; then
            duration=$(( $(date +%s) - STARTED ))
            (( duration < 0 )) && duration=0
          fi
          python3 - "$RUNNER_TEMP/codeql-result/$LANGUAGE.json" "$LANGUAGE" "$outcome" "$duration" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, language, outcome, duration = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "language": language,
                      "candidateSha": "${{ github.sha }}",
                      "outcome": outcome,
                      "durationSeconds": float(duration),
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload language result
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validation-codeql-${{ github.run_id }}-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-result
          retention-days: 30
          if-no-files-found: error

  codeql-result:
    name: Validation CodeQL result
    needs:
      - preflight
      - codeql-shadow
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Read the current default-branch base for freshness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the current default branch for freshness
        shell: bash
        run: git fetch --no-tags origin main --depth=1
      - name: Download the complete Preflight output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-shadow-preflight-${{ github.run_id }}
          path: validation-output
      - name: Download parallel language results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: validation-codeql-${{ github.run_id }}-*
          path: validation-output/codeql-results
          merge-multiple: true
      - name: Aggregate CodeQL without changing security authority
        shell: bash
        run: |
          set +e
          python3 .github/scripts/validation_codeql.py \
            --plan validation-output/validation-plan.json \
            --result-dir validation-output/codeql-results \
            --output validation-output/evidence/codeql-advanced.json \
            --now "$(date +%s)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload aggregate CodeQL evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validation-codeql-result-${{ github.run_id }}
          path: validation-output/evidence/codeql-advanced.json
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    name: Validation Shadow report
    needs:
      - preflight
      - linux-x64-bazel
      - postgresql
      - v8
      - windows-x64
      - targeted
      - sdk
      - rust-full
      - codeql-shadow
      - codeql-result
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the current default branch for freshness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the current default branch for freshness
        shell: bash
        run: git fetch --no-tags origin main --depth=1
      - name: Download the complete Preflight output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-shadow-preflight-${{ github.run_id }}
          path: validation-output
      - name: Capture dependency conclusions
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("validation-output/needs.json").write_text(os.environ["NEEDS"] + "\n", encoding="utf-8")
          PY
      - name: Download aggregate CodeQL evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: validation-codeql-result-${{ github.run_id }}
          path: validation-output/evidence
      - name: Emit manifests and terminal report
        shell: bash
        env:
          CACHE_FALLBACK: ${{ inputs.cache_fallback || 'not-applicable' }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set +e
          current_base="$(git rev-parse origin/main)"
          now="$(date +%s)"
          started="$(cat validation-output/validation-started-at 2>/dev/null || echo 0)"
          elapsed=0
          if [[ "$started" =~ ^[0-9]+$ && "$now" =~ ^[0-9]+$ && "$now" -ge "$started" ]]; then
            elapsed=$((now - started))
          fi
          python3 .github/scripts/validation_emit_results.py \
            --plan validation-output/validation-plan.json \
            --results validation-output/needs.json \
            --output validation-output \
            --current-base "$current_base" \
            --now "$now" \
            --duration-seconds "$elapsed" \
            --attempt "$ATTEMPT" \
            --cache-fallback "$CACHE_FALLBACK" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          python3 .github/scripts/validation_comparison.py \
            --report validation-output/validation-report.json \
            --check-name "Validation Shadow" \
            --output validation-output/replacement-observation.json
          comparison_status=$?
          if [[ "$status" -eq 0 && "$comparison_status" -ne 0 ]]; then
            status=$comparison_status
          fi
          exit "$status"
      - name: Upload the Shadow Validation report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validation-shadow-report-${{ github.run_id }}
          path: validation-output
          retention-days: 7
          if-no-files-found: warn
