name: PostgreSQL Runtime State contracts

on:
  workflow_call:
    inputs:
      artifact_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  postgres-contracts:
    name: PostgreSQL 18 Runtime State contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_INCREMENTAL: "0"
      CODEX_TEST_POSTGRES_URL: postgresql://codex:codex-test@localhost:5432/codex_runtime_state_test
      NEXTEST_ARCHIVE_FILE: nextest-${{ inputs.artifact_id }}.tar.zst
      NEXTEST_JUNIT_FILE: ${{ github.workspace }}/codex-rs/target/nextest/default/junit.xml
      TEST_HELPERS_ARTIFACT: nextest-test-helpers-${{ inputs.artifact_id }}
      SCCACHE_CACHE_SIZE: 2G
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: codex_runtime_state_test
          POSTGRES_PASSWORD: codex-test
          POSTGRES_USER: codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex -d codex_runtime_state_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Compute lockfile hash
        if: ${{ inputs.artifact_id == '' }}
        id: lockhash
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(sha256sum Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain_hash=$(sha256sum rust-toolchain.toml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        if: ${{ inputs.artifact_id == '' }}
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-ubuntu-24.04-x86_64-unknown-linux-gnu-ci-test-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-ubuntu-24.04-x86_64-unknown-linux-gnu-ci-test-

      - name: Install sccache
        if: ${{ inputs.artifact_id == '' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: ${{ inputs.artifact_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${CI_BUILD_ROOT}/sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: ${{ inputs.artifact_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ inputs.artifact_id == '' && env.SCCACHE_GHA_ENABLED != 'true' }}
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-ubuntu-24.04-x86_64-unknown-linux-gnu-ci-test-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-ubuntu-24.04-x86_64-unknown-linux-gnu-ci-test-${{ steps.lockhash.outputs.hash }}-
            sccache-ubuntu-24.04-x86_64-unknown-linux-gnu-ci-test-

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        if: ${{ inputs.artifact_id == '' }}
        with:
          tool: nextest
      - name: Run PostgreSQL Runtime State contracts
        if: ${{ inputs.artifact_id == '' }}
        run: |
          just test -p codex-state --run-ignored ignored-only -E 'test(/postgres_contract_/)'
          just test -p codex-thread-store --run-ignored ignored-only -E 'test(/postgres_contract_/)'
          just test -p codex-app-server --run-ignored ignored-only -E 'test(/postgres_contract_/)'
          just test -p codex-app-server-transport --run-ignored ignored-only -E 'test(/postgres_contract_/)'
          just test -p codex-memories-write --run-ignored ignored-only -E 'test(/postgres_contract_/)'
          just test -p codex-cli --run-ignored ignored-only -E 'test(/state_(migrate|initialize)_process_/)'

      - name: Install archive-consumer dependencies
        if: ${{ inputs.artifact_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap

      - name: Install pinned nextest for archive consumption
        if: ${{ inputs.artifact_id != '' }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Enable unprivileged user namespaces
        if: ${{ inputs.artifact_id != '' }}
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Download nextest archive
        if: ${{ inputs.artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive-${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/nextest-archive

      - name: Download runtime test helpers
        if: ${{ inputs.artifact_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.TEST_HELPERS_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.TEST_HELPERS_ARTIFACT }}

      - name: Validate PostgreSQL contract inventory
        id: inventory
        if: ${{ inputs.artifact_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${NEXTEST_JUNIT_FILE}"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/postgres_contract_inventory.py" \
            --repo "${GITHUB_WORKSPACE}" \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Run PostgreSQL contracts from nextest archive
        id: archive_test
        if: ${{ inputs.artifact_id != '' && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_file="${RUNNER_TEMP}/nextest-archive/${NEXTEST_ARCHIVE_FILE}"
          extract_dir="${RUNNER_TEMP}/nextest-extracted"
          workspace_root="$(pwd)"
          helper_dir="${RUNNER_TEMP}/${TEST_HELPERS_ARTIFACT}"
          helper_target_dir="${CARGO_TARGET_DIR}/x86_64-unknown-linux-gnu/ci-test"
          junit="${NEXTEST_JUNIT_FILE}"
          mkdir -p "${extract_dir}" "${helper_target_dir}"
          rm -f -- "${junit}"

          target_runner_env="CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER"
          if [[ "${{ runner.environment }}" == "github-hosted" && ( -e /tmp/.git || -L /tmp/.git ) ]]; then
            echo "::warning::Moving inherited /tmp/.git so tests do not detect /tmp as a repository"
            sudo mv -- /tmp/.git "${RUNNER_TEMP}/inherited-tmp-dot-git"
          fi
          test_runner="${RUNNER_TEMP}/nextest-test-runner"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            '' \
            "unset \"${target_runner_env}\"" \
            '' \
            'if [[ -d /tmp/.git ]]; then' \
            '  rmdir /tmp/.git 2>/dev/null || true' \
            'fi' \
            '' \
            'exec "$@"' \
            > "${test_runner}"
          chmod +x "${test_runner}"
          export "${target_runner_env}=${test_runner}"
          cp "${helper_dir}/codex-linux-sandbox" "${helper_target_dir}/"
          chmod +x "${helper_target_dir}/codex-linux-sandbox"
          sandbox_helper="${helper_target_dir}/codex-linux-sandbox"

          set +e
          env \
            "CARGO_BIN_EXE_codex-linux-sandbox=${sandbox_helper}" \
            "CARGO_BIN_EXE_codex_linux_sandbox=${sandbox_helper}" \
            cargo nextest run \
              --no-fail-fast \
              --archive-file "${archive_file}" \
              --extract-to "${extract_dir}" \
              --workspace-remap "${workspace_root}" \
              --run-ignored=only \
              --test-threads 4 \
              -E '${{ steps.inventory.outputs.filter }}'
          test_status=$?
          set -e
          echo "status=${test_status}" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          RUST_BACKTRACE: 1
          RUST_MIN_STACK: "8388608" # 8 MiB
          NEXTEST_STATUS_LEVEL: leak

      - name: Inspect archive nextest JUnit signal
        id: archive_junit
        if: ${{ always() && inputs.artifact_id != '' && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/check_nextest_junit.py" \
            "${NEXTEST_JUNIT_FILE}" \
            --expected-testcases "${{ steps.inventory.outputs.expected_total }}"

      - name: Upload archive nextest JUnit report
        if: ${{ always() && inputs.artifact_id != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-junit-rust-ci-${{ inputs.artifact_id }}-postgres-contracts
          path: ${{ env.NEXTEST_JUNIT_FILE }}
          if-no-files-found: warn

      - name: Confirm archive PostgreSQL contract result
        if: ${{ always() && inputs.artifact_id != '' }}
        shell: bash
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          TEST_OUTCOME: ${{ steps.archive_test.outcome }}
          TEST_STATUS: ${{ steps.archive_test.outputs.status }}
          JUNIT_OUTCOME: ${{ steps.archive_junit.outcome }}
        run: |
          set -euo pipefail
          status=0
          if [[ "${INVENTORY_OUTCOME}" != "success" ]]; then
            echo "PostgreSQL inventory finished with outcome: ${INVENTORY_OUTCOME}" >&2
            status=1
          fi
          if [[ "${TEST_OUTCOME}" != "success" || "${TEST_STATUS}" != "0" ]]; then
            echo "PostgreSQL nextest command finished with outcome ${TEST_OUTCOME} and status ${TEST_STATUS:-missing}" >&2
            status=1
          fi
          if [[ "${JUNIT_OUTCOME}" != "success" ]]; then
            echo "PostgreSQL nextest JUnit inspection finished with outcome: ${JUNIT_OUTCOME}" >&2
            status=1
          fi
          exit "${status}"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

      - name: Save cargo home cache
        if: always() && !cancelled() && inputs.artifact_id == '' && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-ubuntu-24.04-x86_64-unknown-linux-gnu-ci-test-${{ steps.lockhash.outputs.hash }}-${{ steps.lockhash.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && inputs.artifact_id == '' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-ubuntu-24.04-x86_64-unknown-linux-gnu-ci-test-${{ steps.lockhash.outputs.hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && inputs.artifact_id == ''
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && inputs.artifact_id == ''
        shell: bash
        run: |
          {
            echo "### sccache stats — PostgreSQL Runtime State contracts"
            echo
            echo '```'
            sccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
